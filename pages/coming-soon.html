<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta
            name="description"
            content="A new chapter is coming — thoughtfully selected stationery, writing tools, notebooks and office essentials by Velmont."
        />
        <meta name="theme-color" content="#263b53" />
        <title>A new chapter is coming | Velmont</title>
        <link rel="icon" type="image/svg+xml" href="../assets/images/branding/favicon.svg" />
        <link
            rel="preload"
            href="../assets/fonts/inter-400-latin.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <script src="../assets/js/theme.js"></script>
        <link rel="stylesheet" href="../assets/vendor/bootstrap.min.css" />
        <link rel="stylesheet" href="../assets/css/style.css" />
        <link rel="stylesheet" href="../assets/css/responsive.css" />
        <link rel="stylesheet" href="../assets/css/dark-mode.css" />
        <link rel="stylesheet" href="../assets/css/rtl.css" />
        <script defer src="../assets/vendor/lucide.min.js"></script>
        <script defer src="../assets/js/products.js"></script>
        <script defer src="../assets/js/main.js"></script>
        <script defer src="../assets/js/forms.js"></script>
    </head>
    <body class="page-coming-soon standalone-page">
        <a class="skip-link" href="#main">Skip to content</a>
        
        <div class="header-tools utility-tools" aria-label="Display preferences"><button class="icon-button" id="theme-toggle" type="button" aria-label="Switch colour theme"><i data-lucide="moon" aria-hidden="true"></i></button><button class="icon-button" id="rtl-toggle" type="button" aria-label="Toggle right-to-left layout" aria-pressed="false"><span class="control-label">RTL</span></button></div>
        <main id="main">
            <section class="section">
                <div class="site-container">
                    <div class="coming-layout">
                        <div>
                            <img
                                class=""
                                src="../assets/images/coming-soon/collection-preview.webp"
                                alt="Upcoming stationery collection wrapped in sage tissue with a peach notebook"
                                width="1400"
                                height="1400"
                                loading="lazy"
                            />
                        </div>
                        <div>
                            <span class="eyebrow">A NEW CHAPTER IS ON ITS WAY</span>
                            <h1>
                                Good things
                                <br />
                                are taking shape.
                            </h1>
                            <p>
                                We’re putting the finishing touches on something thoughtful.
                                Explore what is coming to the collection.
                            </p>
                            <form class="enquiry-form" data-form="newsletter">
                                <p class="form-note">
                                    Online submission is currently unavailable. Your details will not be sent or stored.
                                </p>
                                <div class="form-grid">
                                    <label>
                                        Email address
                                        <span aria-hidden="true">*</span>
                                        <input
                                            name="email"
                                            type="email"
                                            required
                                            autocomplete="email" placeholder="you@example.com"
                                        />
                                    </label>
                                </div>
                                <button class="button" type="submit">
                                    Register interest
                                    <i data-lucide="arrow-right" aria-hidden="true"></i>
                                </button>
                                <p class="form-status" role="status" aria-live="polite"></p>
                            </form>
                            <a class="text-link" href="index.html">
                                Return home
                                <i data-lucide="arrow-right" aria-hidden="true"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        
        
    </body>
</html>
